[package]
name = "qmutant"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
description = "Mutation testing for QML"
license = "MIT"
repository = "https://github.com/fihuza/qmutant"
readme = "README.md"
keywords = ["mutation-testing", "qml", "qt", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
publish = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
ctrlc = { version = "3.5.2", features = ["termination"] }
globset = "0.4.20"
ignore = "0.4.33"
indicatif = "0.18.6"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.27.0"
tree-sitter-qmljs = "0.3.1"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
insta = { version = "1.48.0", features = ["json"] }
nix = { version = "0.31.3", features = ["fs", "signal"] }
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
